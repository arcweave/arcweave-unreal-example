ContentBrowserTab1.SelectedPaths=/Game/TopDown

[/Script/UnrealEd.EditorLoadingSavingSettings]
; Do not offer to import Arcweave JSON exports as assets; the plugin reads them directly from disk.
; Replaces the engine default /Game/ entry, so its Localization/* exclusion is restated here.
!AutoReimportDirectorySettings=ClearArray
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*",bInclude=False),(Wildcard="ArcweaveExport/*.json",bInclude=False)))
